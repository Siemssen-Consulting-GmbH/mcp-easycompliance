# Baut das Docker-Image des MCP-Servers aus dem Quellcode (Dockerfile im
# Repo-Root) und veroeffentlicht es auf Docker Hub - Grundlage fuer
# Variante C in deploy/DEPLOYMENT.md: Betrieb komplett ueber die
# Plesk-Docker-GUI, deren Katalogsuche direkt auf Docker Hub zugreift.
#
# Voraussetzungen im Repo (Maintainer):
#  - Secret DOCKERHUB_USERNAME: Docker-Hub-Namespace (z. B. siemssenconsulting)
#  - Secret DOCKERHUB_TOKEN:    Docker-Hub Access Token (Read & Write)
# Das Image erscheint als <DOCKERHUB_USERNAME>/mcp-easycompliance mit den
# Tags <package.json-Version> und latest (oeffentlich, Standard bei
# Docker Hub Free fuer neue Repositories).
name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version aus package.json lesen
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image bauen (Version + latest)
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/mcp-easycompliance:${{ steps.pkg.outputs.version }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/mcp-easycompliance:latest" .

      # Smoke-Test VOR dem Push: Container starten und /healthz abfragen -
      # ein kaputtes Image erreicht die Registry damit gar nicht erst.
      - name: Smoke-Test (/healthz im Container)
        run: |
          docker run -d --name smoke -p 127.0.0.1:8765:8765 \
            "${{ secrets.DOCKERHUB_USERNAME }}/mcp-easycompliance:latest"
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/healthz
          docker rm -f smoke

      - name: Push (alle Tags)
        run: docker push --all-tags "${{ secrets.DOCKERHUB_USERNAME }}/mcp-easycompliance"
